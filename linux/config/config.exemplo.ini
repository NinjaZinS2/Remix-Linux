# Exemplo de config.ini do Remix.
#
# O arquivo de verdade fica em ~/.config/remix/config.ini (ou na pasta do app,
# no modo portátil) e é escrito pelo próprio programa: este aqui serve só para
# documentar as chaves. Copiar só as linhas que você quiser mudar já funciona;
# o que faltar entra no padrão.

[General]
# Pasta da sua biblioteca. Vazio = o Remix procura em Músicas, Downloads,
# Documentos e Área de trabalho.
MusicFolder=
Theme=verde.theme
# normal | vertical
DisplayMode=normal
# 0 = Clássico, 1 = Remix (lateral, início com novidades, player embaixo)
Style=1
# Largura da barra lateral, em pontos (170 a 460)
SideW=250

# --- Fontes externas -------------------------------------------------------
# Caminho de um programa de linha de comando compatível que VOCÊ instalou.
# O Remix não instala, não baixa e não distribui nada: ele só executa o que
# estiver aqui. Vazio = as fontes externas ficam desligadas e o player local,
# as playlists e os arquivos continuam funcionando normalmente.
#
# O contrato: o programa precisa aceitar -j/-J, -f, -o, --flat-playlist,
# --playlist-items, --no-playlist, --ignore-config, --ffmpeg-location e
# --js-runtimes, e imprimir JSON na saída padrão. Qualquer CLI que cumpra isso
# serve. Também é preciso ter ffmpeg e, para algumas fontes, um "JavaScript
# runtime" (Deno 2.3+ ou Node.js 22+) no PATH.
#
# Exemplo:
# MediaCli=/usr/bin/<programa>
MediaCli=

# O que acontece ao tocar algo de uma fonte externa:
#   stream   = toca direto da memória (padrão, nada vai para o disco)
#   download = além de tocar, salva uma cópia na pasta abaixo
OnlineMode=stream
# mp3 | m4a | original (formato da cópia salva)
OnlineFormat=mp3
# 0 = YouTube Music, 1 = YouTube, 2 = SoundCloud
OnlineSource=1
# Pasta onde salvar as cópias. Vazio = <sua pasta de músicas>/Remix Online
DownloadFolder=
# 1 = perguntar a pasta antes de salvar
AskDownloadFolder=1
# Buscar novidades e recomendações na internet (catálogo público, só metadados).
# 0 = o app não busca nada sozinho e o Início mostra só a sua biblioteca.
Novidades=1

# --- Separar em partes (stems) --------------------------------------------
# Linha de comando de um separador que VOCÊ instalou, com {entrada} (o arquivo)
# e {saida} (a pasta). O Remix executa, olha os arquivos que apareceram e
# reconhece as partes pelo NOME: vocal/vocals/voz, instrumental/no_vocals/
# accompaniment/karaoke, drums/bateria, bass/baixo, other/outros. Serve qualquer
# separador que grave um arquivo por parte (inclusive dentro de subpastas).
# Vazio = os modos de stem ficam desligados.
#
# Recomendado: audio-separator (aberto, MIT). Instale só a parte de CPU:
#   uv tool install "audio-separator[cpu]" audioread --torch-backend cpu
# e aponte um MODELO (sem -m ele usa o BS-Roformer, lento demais em CPU):
#   SepCmd=audio-separator {entrada} --output_dir {saida} --output_format FLAC -m UVR-MDX-NET-Inst_HQ_4.onnx
# Para as 4 partes (bateria/baixo separados), via Demucs no mesmo programa:
#   SepCmd=audio-separator {entrada} --output_dir {saida} --output_format FLAC -m htdemucs.yaml
# Ou o Demucs sozinho:
#   SepCmd=demucs -d cpu -o {saida} --filename {stem}.{ext} {entrada}
# Detalhes e comparação em docs/SEPARADORES.md. Se faltar {saida}, o Remix
# acrescenta "--output_dir <pasta>"; se faltar {entrada}, o arquivo vai no fim.
SepCmd=
# Quanta CPU a separação pode usar: 1 = leve (~1/4 dos núcleos, padrão),
# 2 = equilibrado (~metade), 3 = rápido (~3/4). O processo roda com prioridade
# baixa e preso a esses núcleos, então não atrapalha jogo, chamada ou trabalho.
StemsCpu=1

# --- Host (ouvir do celular) ----------------------------------------------
HostOn=0
HostPort=49875
# 4 a 12 dígitos, obrigatório para ligar
HostPin=
HostTunnel=1
HostLan=1
HostName=
# O celular pode usar as fontes externas do PC
HostOnline=1
HostQrConfirm=0
HostIPv6=0

# --- Discord --------------------------------------------------------------
# Application ID do SEU aplicativo, para mostrar no seu perfil o que está
# tocando. Vazio = desligado.
RpcAppId=

# --- Som -------------------------------------------------------------------
# Dispositivo de saída. Vazio = o que o sistema estiver usando.
OutDevice=
Volume=60
# Efeitos: 0 (desligado) a 3
FxSlow=0
FxSpeed=0
FxReverb=0
FxBass=0
Fx8D=0
EqOn=0
Eq=0,0,0,0,0,0,0,0

[Reproducao]
Autoplay=1
# title | artist | file | date | manual
SortMode=title
SortDesc=0
BackgroundOnClose=1
SystemMediaControls=1
